# ─────────────────────────────────────────────────────────────
#  FASE 3 — Ejecutar el agente (MOCK) y publicar su veredicto JSON
# ─────────────────────────────────────────────────────────────
# Sobre la Fase 2 (contexto + diff) añadimos: checkout del repo,
# instalación de Node, ejecución de agent/review.js y volcado del
# veredicto JSON al resumen del job. Todavía sin IA.

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Revisar PR
    runs-on: ubuntu-latest

    env:
      PR_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_ADDITIONS: ${{ github.event.pull_request.additions }}
      PR_DELETIONS: ${{ github.event.pull_request.deletions }}
      PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
      DIFF_FILE: pr.diff
      FILES_FILE: changed_files.txt

    steps:
      # Necesario para disponer de agent/review.js en el runner.
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Diff (Fase 2) ────────────────────────────────────────
      - name: Obtener diff y archivos cambiados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$PR_REPO" --name-only | tee "$FILES_FILE"
          gh pr diff "$PR_NUMBER" --repo "$PR_REPO" > "$DIFF_FILE"
          echo "Diff obtenido: $(wc -l < "$DIFF_FILE") líneas."

      # ── Agente (Fase 3) ──────────────────────────────────────
      - name: Ejecutar agente y generar veredicto
        run: |
          node agent/review.js | tee verdict.json

      # ── Resumen visible ──────────────────────────────────────
      - name: Volcar veredicto y contexto al resumen del job
        run: |
          VERDICT=$(jq -r '.verdict' verdict.json)
          ALIGNED=$(jq -r '.aligned' verdict.json)
          case "$VERDICT" in
            approve)         ICON="✅" ;;
            request_changes) ICON="❌" ;;
            *)               ICON="💬" ;;
          esac
          {
            echo "## 🤖 PR Check — Fase 3: veredicto del agente (mock)"
            echo ""
            echo "### $ICON Veredicto: \`$VERDICT\` · alineado: \`$ALIGNED\`"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| PR | #$PR_NUMBER |"
            echo "| Autor | \`$PR_AUTHOR\` |"
            echo "| Tamaño | +$PR_ADDITIONS / -$PR_DELETIONS · $PR_CHANGED_FILES archivo(s) |"
            echo ""
            echo "### 📄 Descripción del PR"
            echo "${PR_BODY:-_(sin descripción)_}"
            echo ""
            echo "### 🧾 Veredicto (JSON estándar)"
            echo ""
            echo '```json'
            cat verdict.json
            echo '```'
            echo ""
            echo "<details><summary>Ver diff (primeras 300 líneas)</summary>"
            echo ""
            echo '```diff'
            head -n 300 "$DIFF_FILE"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
