# ─────────────────────────────────────────────────────────────
#  FASE 0 — Dejar traza de que el Action se ejecutó en un PR
# ─────────────────────────────────────────────────────────────
# Este workflow no tiene lógica todavía: solo demuestra que, al
# abrir/actualizar un Pull Request, GitHub Actions se dispara y
# deja constancia (en el log y en el resumen del job).

name: PR Check

# ¿CUÁNDO se ejecuta? -> en eventos de Pull Request contra cualquier rama.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trace:
    name: Dejar traza
    runs-on: ubuntu-latest
    steps:
      # 1) Traza en el LOG del job (pestaña Actions -> este job -> logs)
      - name: Traza en el log
        run: |
          echo "✅ El workflow 'PR Check' se ejecutó."
          echo "Evento         : ${{ github.event_name }}"
          echo "Repositorio    : ${{ github.repository }}"
          echo "PR número      : #${{ github.event.pull_request.number }}"
          echo "Rama origen    : ${{ github.head_ref }}"
          echo "Rama destino   : ${{ github.base_ref }}"
          echo "Commit (SHA)   : ${{ github.sha }}"

      # 2) Traza VISIBLE en el resumen del job (más fácil de encontrar)
      - name: Traza en el resumen del job
        run: |
          {
            echo "## 🤖 PR Check — Fase 0"
            echo ""
            echo "El Action **pasó por aquí**. ✅"
            echo ""
            echo "- **Evento:** \`${{ github.event_name }}\`"
            echo "- **PR:** #${{ github.event.pull_request.number }}"
            echo "- **Rama:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
