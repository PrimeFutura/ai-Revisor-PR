# ─────────────────────────────────────────────────────────────
#  FASE 4 — Agente de IA REAL evaluando el PR
# ─────────────────────────────────────────────────────────────
# Sobre la Fase 3 añadimos: instalación de dependencias (openai) y
# el paso de la credencial (secret) al agente. El agente compara la
# descripción del PR contra el diff y devuelve el veredicto JSON.

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  # En tu oficina (GitHub Models), añadirías aquí:  models: read

jobs:
  review:
    name: Revisar PR
    runs-on: ubuntu-latest

    env:
      PR_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_ADDITIONS: ${{ github.event.pull_request.additions }}
      PR_DELETIONS: ${{ github.event.pull_request.deletions }}
      PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
      DIFF_FILE: pr.diff
      FILES_FILE: changed_files.txt

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Obtener diff y archivos cambiados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$PR_REPO" --name-only | tee "$FILES_FILE"
          gh pr diff "$PR_NUMBER" --repo "$PR_REPO" > "$DIFF_FILE"
          echo "Diff obtenido: $(wc -l < "$DIFF_FILE") líneas."

      - name: Ejecutar agente de IA y generar veredicto
        env:
          # Hoy: tu API key de OpenAI (guardada como secret).
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          # LLM_BASE_URL vacío = OpenAI. En tu oficina, para GitHub Models:
          #   LLM_BASE_URL: https://models.github.ai/inference
          #   LLM_API_KEY:  ${{ github.token }}   (con permiso models: read)
          #   LLM_MODEL:    openai/gpt-4o-mini
        run: |
          node agent/review.js | tee verdict.json

      - name: Volcar veredicto al resumen del job
        run: |
          VERDICT=$(jq -r '.verdict' verdict.json)
          ALIGNED=$(jq -r '.aligned' verdict.json)
          ENGINE=$(jq -r '.metadata.engine' verdict.json)
          MODEL=$(jq -r '.metadata.model // "—"' verdict.json)
          SUMMARY=$(jq -r '.summary' verdict.json)
          case "$VERDICT" in
            approve)         ICON="✅" ;;
            request_changes) ICON="❌" ;;
            *)               ICON="💬" ;;
          esac
          {
            echo "## 🤖 PR Check — Fase 4: veredicto del agente de IA"
            echo ""
            echo "### $ICON Veredicto: \`$VERDICT\` · alineado: \`$ALIGNED\`"
            echo ""
            echo "> $SUMMARY"
            echo ""
            echo "_Motor: \`$ENGINE\` · Modelo: \`$MODEL\`_"
            echo ""
            echo "### 🧾 Veredicto completo (JSON estándar)"
            echo ""
            echo '```json'
            cat verdict.json
            echo '```'
            echo ""
            echo "<details><summary>Ver diff (primeras 300 líneas)</summary>"
            echo ""
            echo '```diff'
            head -n 300 "$DIFF_FILE"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
