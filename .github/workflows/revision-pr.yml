# ─────────────────────────────────────────────────────────────
#  FASE 5 — Comentar en el PR y poder BLOQUEAR el merge
# ─────────────────────────────────────────────────────────────
# Sobre la Fase 4 añadimos: publicar (y actualizar) un comentario
# con el veredicto en el propio PR, y hacer que el check FALLE
# cuando el veredicto sea 'cambios_requeridos' (para que, junto a
# una regla de protección de rama, impida fusionar).
#
# Nota: 'GH_TOKEN', 'GITHUB_STEP_SUMMARY', 'GITHUB_REPOSITORY' y
# 'github.token' son nombres FIJOS de GitHub/gh y no se traducen.

name: Revisión de PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write # ahora ESCRIBIMOS: hace falta para comentar
  # En tu oficina (GitHub Models), añadirías aquí:  models: read

jobs:
  revisar:
    name: Revisar PR
    runs-on: ubuntu-latest

    env:
      PR_REPOSITORIO: ${{ github.repository }}
      PR_NUMERO: ${{ github.event.pull_request.number }}
      PR_TITULO: ${{ github.event.pull_request.title }}
      PR_DESCRIPCION: ${{ github.event.pull_request.body }}
      PR_AUTOR: ${{ github.event.pull_request.user.login }}
      PR_ADICIONES: ${{ github.event.pull_request.additions }}
      PR_ELIMINACIONES: ${{ github.event.pull_request.deletions }}
      PR_ARCHIVOS_CAMBIADOS: ${{ github.event.pull_request.changed_files }}
      ARCHIVO_DIFF: pr.diff
      ARCHIVO_LISTA: archivos_cambiados.txt

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Obtener diff y archivos cambiados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "$PR_NUMERO" --repo "$PR_REPOSITORIO" --name-only | tee "$ARCHIVO_LISTA"
          gh pr diff "$PR_NUMERO" --repo "$PR_REPOSITORIO" > "$ARCHIVO_DIFF"
          echo "Diff obtenido: $(wc -l < "$ARCHIVO_DIFF") líneas."

      - name: Ejecutar agente de IA y generar veredicto
        env:
          IA_CLAVE_API: ${{ secrets.IA_CLAVE_API }}
          IA_MODELO: gpt-4o-mini
          # IA_URL_BASE vacío = OpenAI. En tu oficina, para GitHub Models:
          #   IA_URL_BASE:  https://models.github.ai/inference
          #   IA_CLAVE_API: ${{ github.token }}   (con permiso models: read)
          #   IA_MODELO:    openai/gpt-4o-mini
        run: |
          node agente/revisor.js | tee veredicto.json

      - name: Construir el comentario
        run: |
          VEREDICTO=$(jq -r '.veredicto' veredicto.json)
          RESUMEN=$(jq -r '.resumen' veredicto.json)
          MOTOR=$(jq -r '.metadatos.motor' veredicto.json)
          MODELO=$(jq -r '.metadatos.modelo // "—"' veredicto.json)
          VERSION=$(jq -r '.version_esquema' veredicto.json)
          NUM=$(jq -r '.hallazgos | length' veredicto.json)
          case "$VEREDICTO" in
            aprobado)           ICONO="✅" ;;
            cambios_requeridos) ICONO="❌" ;;
            *)                  ICONO="💬" ;;
          esac
          {
            # Marca oculta para reconocer NUESTRO comentario y actualizarlo.
            echo "<!-- revisor-ia -->"
            echo "## 🤖 Revisión automática del PR"
            echo ""
            echo "### $ICONO Veredicto: \`$VEREDICTO\`"
            echo ""
            echo "> $RESUMEN"
            echo ""
            if [ "$NUM" -gt 0 ]; then
              echo "**Hallazgos ($NUM):**"
              jq -r '.hallazgos[] | "- **\(.severidad | ascii_upcase)** · `\(.tipo)`\(if (.archivos|length)>0 then " (" + (.archivos|join(", ")) + ")" else "" end): \(.mensaje)"' veredicto.json
              echo ""
            fi
            echo "<sub>Motor: \`$MOTOR\` · Modelo: \`$MODELO\` · Contrato JSON v$VERSION · Actualizado automáticamente</sub>"
          } > comentario.md
          echo "----- comentario.md -----"
          cat comentario.md

      - name: Publicar o actualizar el comentario en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 'sticky': intenta EDITAR el último comentario del bot; si no
          # existe (primera vez), CREA uno nuevo. Así no se llena de spam.
          gh pr comment "$PR_NUMERO" --repo "$PR_REPOSITORIO" --body-file comentario.md --edit-last \
            || gh pr comment "$PR_NUMERO" --repo "$PR_REPOSITORIO" --body-file comentario.md

      - name: Volcar veredicto al resumen del job
        run: |
          VEREDICTO=$(jq -r '.veredicto' veredicto.json)
          {
            echo "## 🤖 Revisión de PR — Fase 5"
            echo ""
            echo "Veredicto: \`$VEREDICTO\`. El comentario fue publicado en el PR."
            echo ""
            echo '```json'
            cat veredicto.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ ÚLTIMO paso: si el veredicto pide cambios, el check FALLA.
      # (El comentario ya se publicó en el paso anterior.)
      - name: Aplicar veredicto (puede bloquear el merge)
        run: |
          VEREDICTO=$(jq -r '.veredicto' veredicto.json)
          if [ "$VEREDICTO" = "cambios_requeridos" ]; then
            echo "::error::El agente solicita cambios (veredicto: cambios_requeridos). Se bloquea el merge."
            exit 1
          fi
          echo "Veredicto '$VEREDICTO': no bloquea el merge. ✅"
